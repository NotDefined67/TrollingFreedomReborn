prefix: '&b&lTFR &8| &7'
# shown when someone runs a command they shouldnt
no-perms: '&b&lTFR &8| &7You have no permission to run this command'
# People in this list literally cannot be trolled. I put myself in here.
blocklist:
  - "LeoMadrassiDev"
  - "Herobrine"
