cannot-troll-yourself: "&b&lTFR &8| &7You cannot troll yourself with this specific troll"
control-troll-grace-period: "&b&lTFR &8| &7The troll has ended so you have &c&l30 seconds &7of spectator mode/invisibility to leave"
