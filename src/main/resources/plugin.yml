name: $name
version: $version
description: $description
author: iAngry, LeoMadrassi
main: com.leomadrassi.trollingfreedomreborn.main.Core
softdepend: [ Essentials, Citizens, ProtocolLib ]
api-version: $apiVersion
commands:
  trollingfreedom:
    description: Plugin help
    aliases: [ tf ]
  trollgui:
    description: Open the troll GUI
    aliases: [ tgui, trollingfreedomgui, tfgui ]
  untroll:
    description: Remove trolls from a player
    aliases: [ untroll, stoptroll ]
  trollf:
    description: Troll someone from command line
    aliases: [ trollcmd ]
  unchesttroll:
    description: Unlock your own inventory
    aliases: [ unlockinv ]
  panicstoptroll:
    description: Emergency stop — kills all plugin tasks
    aliases: [ trollpanic, trollps, pstoptroll, tfrstop, tfstop ]
  control:
    description: Take control of a player
